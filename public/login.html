<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body {
  min-height: 100vh;
  background: url("https://images.unsplash.com/photo-1562774053-701939374585") no-repeat center/cover;
  display: flex;
  flex-direction: column;
}

/* OVERLAY */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 0;
}

/* HEADER */
.header {
  position: relative;
  z-index: 1;
  text-align: center;
  color: white;
  padding: 25px 20px;
}

.header h1 {
  font-size: 30px;
}

.header p {
  opacity: 0.8;
}

/* CENTER */
.container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1;
}

/* LOGIN BOX */
.login-box {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  padding: 45px 30px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  color: white;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  animation: fadeIn 1s ease;
}

/* TITLE */
.login-box h2 {
  margin-bottom: 20px;
}

/* INPUT */
input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border-radius: 25px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.2);
  color: white;
}

input::placeholder {
  color: #ddd;
}

input:focus {
  background: rgba(255,255,255,0.3);
  box-shadow: 0 0 8px #00c6ff;
}

/* BUTTON */
button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

/* ANIMATION */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */
@media(max-width:600px) {
  .login-box {
    width: 90%;
  }

  .header h1 {
    font-size: 24px;
  }
}

</style>
</head>

<body>

<div class="header">
  <h1>S. Vellaichamy Nadar College</h1>
  <p>Admin Student Management System</p>
</div>

<div class="container">
  <div class="login-box">
    <h2>🔐 Admin Login</h2>

    <form action="/login" method="POST">
      <input type="text" name="phone" placeholder="📱 Phone Number" required>
      <input type="password" name="password" placeholder="🔒 Password" required>
      <button type="submit">Login</button>
    </form>

  </div>
</div>

</body>
</html>
