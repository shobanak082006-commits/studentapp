<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Student</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body {
  min-height: 100vh;
  background: url("https://images.unsplash.com/photo-1562774053-701939374585") no-repeat center/cover;
  display: flex;
  flex-direction: column;
}

/* OVERLAY */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 0;
}

/* HEADER */
.header {
  position: relative;
  z-index: 1;
  text-align: center;
  color: white;
  padding: 20px;
}

.header h1 {
  font-size: 28px;
}

.header p {
  font-size: 14px;
  opacity: 0.8;
}

/* CENTER */
.wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 1;
}

/* FORM CARD */
.container {
  width: 100%;
  max-width: 900px;
  background: #ffffff;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

/* TITLE */
h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #1e3c72;
}

/* GRID */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

/* INPUT */
input, select, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

input:focus, select:focus, textarea:focus {
  border: 2px solid #2a5298;
  outline: none;
}

/* FULL */
.full {
  grid-column: 1 / 3;
}

/* FILE */
.file-box {
  border: 2px dashed #2a5298;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}

/* PREVIEW */
#preview img {
  width: 100px;
  margin-top: 10px;
  border-radius: 10px;
}

/* BUTTON */
button {
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #2a5298;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1e3c72;
}

/* MOBILE */
@media(max-width:768px) {
  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: 1;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>S. Vellaichamy Nadar College</h1>
  <p>Student Management System</p>
</div>

<div class="wrapper">

<div class="container">
  <h2>Add Student</h2>

  <form id="studentForm" action="/add-student" method="POST" enctype="multipart/form-data">

    <div class="form-grid">

      <input type="text" name="name" placeholder="Student Name" required>
      <input type="text" name="registerNo" placeholder="Register Number" required>

      <input type="text" name="phone" placeholder="Phone Number" required>
      <input type="text" name="parentPhone" placeholder="Parent Phone">

      <input type="email" name="email" placeholder="Email">

      <select name="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <input type="text" name="fatherName" placeholder="Father Name">
      <input type="text" name="motherName" placeholder="Mother Name">

      <input type="date" name="dob">

      <!-- ✅ FULL BLOOD GROUP -->
      <select name="bloodGroup" required>
        <option value="" disabled selected>Select Blood Group</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
      </select>

      <input type="text" name="caste" placeholder="Caste">
      <input type="text" name="religion" placeholder="Religion">

      <input type="number" name="attendancePercentage" placeholder="Attendance %" min="0" max="100">
      <input type="number" name="semesterPercentage" placeholder="Semester %" min="0" max="100">

      <input type="text" name="course" placeholder="Course">

      <textarea name="address" placeholder="Address" class="full"></textarea>

      <div class="file-box full">
        <label>Upload Photo</label><br><br>
        <input type="file" id="photo" name="photo" accept="image/*">
        <div id="preview"></div>
      </div>

      <button type="submit" class="full">Add Student</button>

    </div>

  </form>
</div>

</div>

<script>
document.getElementById("photo").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      document.getElementById("preview").innerHTML = `<img src="${e.target.result}">`;
    }
    reader.readAsDataURL(file);
  }
});
</script>

</body>
</html>
